name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A student pushing three fixes in a row should pay for one build, not three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The build itself lives in the course template so a fix reaches every
    # student repo on its next push. Editing this file is rarely what you
    # want -- change build-firmware.yml in Virtual-Microcontroller/base.
    # `uses:` cannot take an expression, so the org and template repo are
    # hardcoded. Change this line if you deploy the course elsewhere.
    uses: Virtual-Microcontroller/base/.github/workflows/build-firmware.yml@main
    # Passed explicitly rather than `secrets: inherit`: the build needs these
    # two and has no business seeing the AI key.
    secrets:
      BACKEND_WEBHOOK_URL: ${{ secrets.BACKEND_WEBHOOK_URL }}
      BACKEND_WEBHOOK_SECRET: ${{ secrets.BACKEND_WEBHOOK_SECRET }}
