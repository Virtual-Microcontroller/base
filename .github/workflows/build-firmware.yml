name: build-firmware

# Reusable. Student repos call this instead of carrying their own copy, so a
# fix here reaches every repo on its next push rather than only repos created
# afterwards.
#
# `actions/checkout` below checks out the CALLER's repository: in a reusable
# workflow the github context always refers to the caller, so this builds the
# student's firmware, not this repo's.
on:
  workflow_call:
    inputs:
      renode-version:
        description: Renode release used for the simulator check.
        type: string
        default: '1.15.3'
      expected-output:
        description: >-
          String the firmware must print on the UART. Empty, the default, means
          any UART output passes, which is what a Makefile `test` target already
          does. Set it only when an exercise requires exact text: every exercise
          prints something different, so a shared default is wrong for all but
          one of them.
        type: string
        default: ''
      artifact-retention-days:
        description: How long to keep app.elf. The backend downloads it at once.
        type: number
        default: 7
    secrets:
      BACKEND_WEBHOOK_URL:
        required: false
      BACKEND_WEBHOOK_SECRET:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENODE_VERSION: ${{ inputs.renode-version }}
      # Job-level so the notify step's `if:` can read it. A step cannot
      # reliably reference a variable declared in its own `env:` block.
      WEBHOOK_URL: ${{ secrets.BACKEND_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check sources are UTF-8
        run: |
          set -euo pipefail

          # Hints are written into these files in Japanese, so from now on the
          # sources carry non-ASCII bytes. A Japanese Windows editor that
          # re-saves as Shift-JIS would mangle them, and -Werror would then
          # turn the assistant's own help into a build error the student did
          # not cause and cannot read. Fail here instead, before the compiler,
          # with a message that says what to do.
          python3 - <<'PY'
          import pathlib, sys

          bad = []
          for path in list(pathlib.Path('.').rglob('*.c')) + \
                      list(pathlib.Path('.').rglob('*.h')):
              try:
                  path.read_bytes().decode('utf8')
              except UnicodeDecodeError as e:
                  bad.append((path, e.start))
          for path, off in bad:
              print(f'::error file={path}::{path} \u306f UTF-8 \u3067\u306f\u3042\u308a\u307e\u305b\u3093'
                    f'\uff08{off} \u30d0\u30a4\u30c8\u76ee\uff09\u3002UTF-8 \u3067\u4fdd\u5b58\u3057\u76f4\u3057\u3066\u304f\u3060\u3055\u3044\u3002'
                    f' / not valid UTF-8 at byte {off}; re-save the file as UTF-8')
          if bad:
              print('VS Code: \u53f3\u4e0b\u306e\u30a8\u30f3\u30b3\u30fc\u30c7\u30a3\u30f3\u30b0\u8868\u793a '
                    '-> Save with Encoding -> UTF-8')
              sys.exit(1)
          print('all .c/.h files are valid UTF-8')
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '13.2.Rel1'

      - name: Restore cached Renode
        id: renode-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: renode_${{ inputs.renode-version }}-dotnet_portable
          key: renode-${{ runner.os }}-${{ inputs.renode-version }}

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          tar -xzf renode.tar.gz
          rm renode.tar.gz

      - name: Add Renode to PATH
        run: echo "$(pwd)/renode_${RENODE_VERSION}-dotnet_portable" >> "$GITHUB_PATH"

      - name: Build
        run: |
          if [ -f Makefile ]; then
            make
          elif [ -f makefile ]; then
            make -f makefile
          elif [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build && cmake .. && make
          else
            echo "No build system found"
            exit 1
          fi

      - name: Find artifacts
        id: find
        run: |
          ELF=$(find . -name "*.elf" -not -path "./.git/*" | head -1)
          if [ -z "$ELF" ]; then
            echo "No .elf file found"
            exit 1
          fi
          echo "elf=$ELF" >> "$GITHUB_OUTPUT"

          REPL=$(find . -name "*.repl" -not -path "./.git/*" | head -1)
          if [ -n "$REPL" ]; then
            echo "repl=$REPL" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare artifact
        run: |
          ELF_PATH=$(realpath "${{ steps.find.outputs.elf }}")
          if [ "$ELF_PATH" != "$(realpath app.elf 2>/dev/null || echo none)" ]; then
            cp "${{ steps.find.outputs.elf }}" app.elf
          fi

          if [ -n "${{ steps.find.outputs.repl }}" ]; then
            REPL_PATH=$(realpath "${{ steps.find.outputs.repl }}")
            if [ "$REPL_PATH" != "$(realpath platform.repl 2>/dev/null || echo none)" ]; then
              cp "${{ steps.find.outputs.repl }}" platform.repl
            fi
          fi

          if [ ! -f platform.json ]; then
            echo '{"platform_repl": "platforms/boards/renesas-ck_ra6m5.repl", "uart_peripheral": "sysbus.sci0"}' > platform.json
          fi

      # Building is not the same as working. Without this a student can ship
      # firmware that compiles and produces no UART output at all, and only
      # find out when they press Run in the simulator.
      - name: Verify in Renode
        env:
          EXPECTED: ${{ inputs.expected-output }}
        run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile; then
            make test
          elif [ -n "$EXPECTED" ]; then
            python3 tests/run_renode_test.py --elf app.elf --expected "$EXPECTED"
          else
            # Omitted, not empty. An empty --expected is satisfied by any
            # buffer at all, including no output, so passing "" would let
            # silent firmware through -- the exact failure this step exists
            # to catch.
            python3 tests/run_renode_test.py --elf app.elf
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-elf
          path: |
            app.elf
            platform.json
            platform.repl
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Notify backend
        if: always() && env.WEBHOOK_URL != ''
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ${{ secrets.BACKEND_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: python3 .github/notify.py
