name: build-hints-impl

# Writes hints INTO the student's source as /* AI-HINT: ... */ lines and
# pushes them to their branch, so help waits in the editor after a pull.
#
# Reusable body. Student repositories carry only the trigger; this holds the
# behaviour, so a correction here reaches every repository on its next failed
# build rather than only repositories created afterwards.
#
# In a called workflow the github context is the CALLER's, so
# github.event.workflow_run.* below refers to the student's failed build, and
# actions/checkout resolves to the student's repository.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  actions: read

env:
  # Comment marker. Must be a whole line of its own, never inline in an
  # expression, so a malformed comment cannot break a file that compiled.
  HINT_RE: '^[[:space:]]*/\* AI-HINT:.*\*/[[:space:]]*$'
  # Assisted failures allowed per repository per calendar day (UTC).
  DAILY_CAP: 10

jobs:
  hints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Decide whether to proceed
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # The student may already have pushed a fix while this job queued.
          # Commenting on code that no longer exists is worse than silence, and
          # it also hands them a rejected push for being quick.
          tip=$(git rev-parse HEAD)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "branch has moved: tip=$tip failed_run=$HEAD_SHA"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Spend limit. Only runs that actually consulted the model cost
          # anything, so a run that stopped at this guard must not consume the
          # budget. Counting runs rather than invocations made the limit far
          # tighter and less predictable than intended.
          today=$(date -u +%Y-%m-%d)
          jq_today="[.[] | select(.createdAt | startswith(\"$today\"))] | .[].databaseId"
          ids=$(gh run list --workflow build-hints.yml --limit 60 --json databaseId,createdAt --jq "$jq_today")
          jq_used='[.jobs[].steps[]? | select(.name | test("claude-code-action")) | select(.conclusion == "success")] | length'
          used=0
          for id in $ids; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/jobs" --jq "$jq_used" 2>/dev/null || echo 0)
            used=$((used + n))
          done
          echo "model invocations today: $used of $DAILY_CAP"

          if [ "$used" -ge "$DAILY_CAP" ]; then
            echo "daily cap reached"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            # Say so once a day. Ask whether a notice already exists rather
            # than inferring it from the count: invocations can jump past the
            # cap when runs overlap, and a count-based test then never fires,
            # leaving the student in exactly the silence this is meant to end.
            jq_notice="[.[] | select(.created_at | startswith(\"$today\")) | select(.body | contains(\"ai-assist-cap-notice\"))] | length"
            told=$(gh api "repos/${GITHUB_REPOSITORY}/comments?per_page=100" --jq "$jq_notice" 2>/dev/null || echo 1)
            if [ "$told" -eq 0 ]; then
              {
                echo "### Assistance paused for today"
                echo
                echo "This repository has used its daily allowance of AI assistance."
                echo "It resets at midnight UTC."
                echo
                echo "Until then: read the **first** error in the Actions log, not"
                echo "the last -- later errors are usually knock-on effects."
                echo "If you are stuck, ask an instructor."
                echo
                echo "<!-- ai-assist-cap-notice -->"
              } > capnote.md
              if gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/comments" -F body=@capnote.md > /dev/null 2>&1; then
                echo "posted the cap notice"
              else
                echo "::warning::could not post the cap notice"
              fi
              cat capnote.md >> "$GITHUB_STEP_SUMMARY"
              rm -f capnote.md
            else
              echo "already notified today; staying silent"
            fi
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Clear previous hints
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Old markers are removed before new ones are written, so hints from
          # earlier attempts do not stack up. The diff check below permits
          # removing marker lines, and nothing else.
          find . \( -name '*.c' -o -name '*.h' \) -print | while read -r f; do
            grep -vE "$HINT_RE" "$f" > "$f.stripped" || true
            mv "$f.stripped" "$f"
          done

      - uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh run view:*),Bash(gh run list:*),Read,Edit,Glob,Grep"
          prompt: |
            You are a lab teaching assistant for an embedded systems course.
            A student's firmware build just failed in this repository.

            Failed run id: ${{ github.event.workflow_run.id }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}

            Read the failure with:
              gh run view ${{ github.event.workflow_run.id }} --log-failed

            THE PROJECT
            Bare-metal C for the Renesas CK-RA6M5 (ARM Cortex-M33).
            startup.c is the vector table and reset handler. link.ld is the
            memory layout, flash at 0x00000000 and RAM at 0x20000000. uart.c
            drives SCI0. main.c is the entry point. `make` builds app.elf and
            `make test` runs it in Renode and requires the expected string on
            the UART. Compiler flags include -Wall -Wextra -Werror, so every
            warning is a build error.

            WHAT TO DO
            Find the FIRST real error. Later errors are usually consequences.

            Decide what kind of failure it is:
            - Infrastructure or CI: toolchain install failed, a download timed
              out, a step was cancelled. Nothing is being taught. Do not edit
              any file at all; make no changes and stop. A re-run fixes it.
            - The student's code: compile error, linker error, or `make test`
              not finding the expected UART output. Leave hints, per below.

            HOW TO LEAVE A HINT
            Use the Edit tool to insert a line directly ABOVE the line that
            needs attention, in the .c or .h file concerned. The line must
            look exactly like this, on a line of its own:

              /* AI-HINT: your hint text here */

            Rules that are enforced mechanically after you finish. If you break
            any of them, nothing is pushed and the student gets no help at all:
            - You may ONLY add whole lines matching that marker exactly.
            - You may NOT change, reformat or delete any existing line.
            - You may ONLY touch .c and .h files. Not the Makefile, not
              link.ld, not any workflow file.
            - Keep the total to at most four markers. One is usually right.
            - Match the indentation of the line below it.
            - Never let the text contain the sequence that would close a
              comment early.

            GIVE HINTS, NOT SOLUTIONS. This rule matters most, and it is
            easier to break now that you are writing next to the code.
            - Never write the corrected code. No fixed lines, no diffs, no
              "change X to Y", no code fragment containing the answer.
            - A marker reading "missing semicolon" is the answer, not a hint,
              and it teaches nothing. Ask what terminates a C statement.
            - Name the concept and point at the place. Quote the exact
              compiler message and translate it into plain language.
            - Prefer one guiding question over a lecture. Keep each marker to
              a single line that a student can read at a glance.

            ESCALATE IF THEY ARE STUCK. Check recent runs with
            `gh run list --limit 10`. If the same error has failed two or three
            times running, the earlier hint did not land, so get more specific
            each time. Past four, say plainly in the marker that it is time to
            ask an instructor.

            COMMON HERE: -Werror promoting an unused variable; `undefined
            reference` from a file missing in SRCS; `region FLASH overflowed`;
            libc calls under -nostdlib; a build that compiles but produces no
            UART output; and a missing `volatile` on a memory-mapped register,
            which produces no diagnostic at all.

            You do not run git. You do not commit, push, or open anything. You
            edit files and stop. The workflow handles the rest.

      - name: Check the diff before anything is pushed
        id: check
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "assistant made no changes"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bad=0

          # Only C sources may be touched.
          if git diff --name-only | grep -vE '\.(c|h)$' > /dev/null; then
            echo "::error::a file other than .c or .h was modified"
            git diff --name-only | grep -vE '\.(c|h)$' | sed 's/^/    /'
            bad=1
          fi

          # Every added or removed line must be a marker line. This is what
          # makes "comments only" a control rather than a request.
          git diff -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            > /tmp/changed.txt || true

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            body=${line:1}
            if ! printf '%s\n' "$body" | grep -qE "$HINT_RE"; then
              echo "::error::non-marker line in diff: $line"
              bad=1
            fi
          done < /tmp/changed.txt

          added=$(grep -c '^+' /tmp/changed.txt || true)
          if [ "$added" -gt 4 ]; then
            echo "::error::$added markers added, at most 4 allowed"
            bad=1
          fi

          if [ "$bad" -ne 0 ]; then
            echo "refusing to push; restoring the tree"
            git checkout -- .
            exit 1
          fi

          echo "diff is markers only: $added added"
          if [ "$added" -gt 0 ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the hints
        if: steps.check.outputs.push == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The branch may have moved while the agent was thinking. The guard
          # cannot catch that: it ran before the agent did. Without this check
          # git push fails as a non-fast-forward, and the student is shown a
          # red workflow they did not cause and cannot act on.
          git fetch -q origin "$BRANCH"
          remote_tip=$(git rev-parse "origin/${BRANCH}")
          if [ "$remote_tip" != "$HEAD_SHA" ]; then
            echo "branch moved while the assistant was working; discarding"
            echo "  triggering commit: $HEAD_SHA"
            echo "  current tip:       $remote_tip"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] stops GitHub building this commit. A push made with
          # GITHUB_TOKEN also cannot trigger a workflow run, so the loop is
          # closed twice over; the marker is kept because it is visible to a
          # human reading the log, and because a PAT would not have that
          # second protection.
          git commit -m "Add build hints for run ${RUN_ID} [skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"
